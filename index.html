<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Odin Library</title>
</head>
<body>
    <header>
        <h1>Odin Library</h1>
    </header>
    <main>
        <section>
            <h2>Add To Library</h2>
            <button id="show-form-dialog-btn">Add Book +</button>
            <dialog id="book-form-dialog">
                <form id="book-form">
                    <div class="form-input">
                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title">
                    </div>
                    <div class="form-input">
                        <label for="author">Author:</label>
                        <input type="text" id="author" name="author">
                    </div>
                    <div class="form-input">
                        <label for="page-count">Page Count:</label>
                        <input type="text" id="page-count" name="page-count">
                    </div>
                    <div class="form-input">
                        <label for="year-published">Year Published:</label>
                        <input type="text" id="year-published" name="year-published">
                    </div>
                    <div>
                        <fieldset>
                            <legend>Have you read this book?</legend>

                            <div>
                                <input type="radio" id="read-yes" name="read" value="true">
                                <label for="read-yes">Yes, I have read this book.</label>
                            
                                <input type="radio" id="read-no" name="read" value="false">
                                <label for="read-no">No, I have not read this book.</label>
                            </div>
                        </fieldset>
                    </div>
                    <div>
                        <button id="close-form-dialog-btn">Close</button>
                        <button id="form-submit-btn" type="submit">Add to Library</button>
                    </div>
                </form>
            </dialog>
        </section>

        <section>
            <h2>Book List</h2>

            <ol class="books">

            </ol>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
